nginx:
  image:
    repository: us-docker.pkg.dev/konaai-public/cams/cams/nginx
    tag: "2.0"
  replicas: 1
  port: 443
  resources:
    requests:
      cpu: 250m
      memory: "128Mi"
    limits:
      memory: "256Mi"
      cpu: 500m
  certGenJob:
    # Pinned version tag for the bitnami/kubectl image used by the
    # self-signed cert generation Job and the bring-your-own-cert Job.
    image:
      repository: bitnami/kubectl
      tag: "1.31"
    resources:
      requests:
        cpu: 50m
        memory: "64Mi"
      limits:
        cpu: 200m
        memory: "128Mi"

litellm:
  image:
    repository: us-docker.pkg.dev/konaai-public/cams/cams/aifabric-litellm
    tag: "2.0"
  replicas: 1
  # LiteLLM Enterprise license key. This placeholder is NOT a valid license --
  # any LiteLLM feature gated on a real license will not work until this is
  # overridden with a genuine key for the deploying customer.
  license: "REPLACE_WITH_VALID_LITELLM_LICENSE_KEY"
  resources:
    requests:
      memory: "5Gi"
    limits:
      memory: "5Gi"

